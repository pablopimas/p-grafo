name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          make --version

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: |
          make install-dev

      - name: Run formatting, linting, tests and build
        run: |
          make check
