name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - ".github/workflows/markdown.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.md"
      - ".github/workflows/markdown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !.venv/**
            !build/**
            !dist/**
